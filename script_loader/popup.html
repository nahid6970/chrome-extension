<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Script Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        body {
            width: 467px;
            height: 520px;
            max-height: 520px;
            margin: 0;
            padding: 12px 16px;
            box-sizing: border-box;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .backup-controls {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .backup-btn {
            border: 1px solid #59427a;
            border-radius: 4px;
            padding: 7px 8px;
            background: #352747;
            color: #f0e6ff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s ease, opacity .15s ease;
        }

        .backup-btn:hover:not(:disabled) { background: #4b3f72; }
        .backup-btn:disabled { cursor: wait; opacity: .65; }
        .backup-btn[data-state="success"] { background: #16825d; border-color: #16825d; }
        .backup-btn[data-state="error"] { background: #7a3030; border-color: #a84545; }
        #restoreSettings { border-color: #315c78; background: #233d50; color: #d7efff; }
        #restoreSettings:hover:not(:disabled) { background: #2d5874; }

        #scriptSearch {
            flex: 1;
            min-width: 0;
            height: 31px;
            box-sizing: border-box;
            padding: 6px 9px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #252526;
            color: #e5e5e5;
            font: 11px 'JetBrains Mono', monospace;
        }

        #scriptSearch::placeholder { color: #858585; }
        #scriptSearch:focus { outline: none; border-color: #0e639c; box-shadow: 0 0 0 1px #0e639c; }

        #statusText {
            min-height: 15px;
            margin-bottom: 7px;
            color: #808080;
            font-size: 10px;
            text-align: right;
            flex-shrink: 0;
        }

        .script-item {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 12px;
            margin-bottom: 8px;
            background: #2d2d30;
            border-radius: 4px;
            border-left: 3px solid #007acc;
            transition: all 0.2s ease;
            gap: 10px;
        }
        
        .script-item:hover {
            background: #323233;
        }
        
        .script-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .script-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        
        .script-icon {
            font-size: 14px;
            color: #4ec9b0;
        }
        
        .script-details {
            flex: 1;
        }
        
        .script-name {
            font-weight: 500;
            color: #d4d4d4;
            margin-bottom: 2px;
        }

        .script-desc {
            font-size: 11px;
            color: #9cdcfe;
            line-height: 1.3;
        }
        
        .script-path {
            font-size: 10px;
            color: #808080;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .toggle-btn {
            background: none;
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            min-width: 45px;
        }

        .script-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn {
            border: none;
            border-radius: 3px;
            padding: 6px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            min-width: 50px;
            transition: all 0.2s;
            background: #4b3f72;
            color: #f0e6ff;
        }

        .settings-btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .mode-btn {
            border: none;
            border-radius: 3px;
            padding: 6px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            min-width: 56px;
            transition: all 0.2s;
        }

        .mode-btn.local {
            background: #3b4d63;
            color: #d7e9ff;
        }

        .mode-btn.site {
            background: #7a4b00;
            color: #ffe1b5;
        }

        .mode-btn.chrome {
            background: #464646;
            color: #f1f1f1;
        }

        .mode-btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        
        .toggle-btn.active {
            background: #16825d;
            color: #ffffff;
        }
        
        .toggle-btn.inactive {
            background: #3c3c3c;
            color: #cccccc;
        }
        
        .toggle-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }
        
        .no-scripts {
            text-align: center;
            color: #808080;
            font-style: italic;
            padding: 20px;
        }
        
        .script-item.enabled {
            border-left-color: #16825d;
            background: #163d2a;
        }
        
        .script-item.disabled {
            border-left-color: #666;
        }

        #scriptList::-webkit-scrollbar {
            width: 8px;
        }

        #scriptList::-webkit-scrollbar-track {
            background: #252526;
            border-radius: 4px;
        }

        #scriptList::-webkit-scrollbar-thumb {
            background: #cccccc;
            border-radius: 4px;
        }

        #scriptList::-webkit-scrollbar-thumb:hover {
            background: #ffffff;
        }
        
        .fallback-settings {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px solid #3a3a3a;
        }

        .fallback-settings.hidden {
            display: none;
        }

        .settings-label {
            font-size: 10px;
            color: #9cdcfe;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .settings-input {
            width: 100%;
            box-sizing: border-box;
            background: #1f1f22;
            color: #d4d4d4;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 8px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .settings-input:focus {
            outline: none;
            border-color: #0e639c;
            box-shadow: 0 0 0 1px #0e639c;
        }

        .settings-hint {
            font-size: 10px;
            color: #808080;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="header" id="popupToolbar" aria-label="Script search and backup tools">
        <input id="scriptSearch" type="search" autocomplete="off" placeholder="⌕ Search scripts and settings…" aria-label="Search scripts and settings">
        <div class="backup-controls" id="backupControls" aria-label="Settings backup controls" aria-live="polite">
            <button id="backupSettings" class="backup-btn" type="button" title="Back up all extension settings">☁ Backup</button>
            <button id="restoreSettings" class="backup-btn" type="button" title="Restore all extension settings">↩ Restore</button>
        </div>
    </div>
    <div id="statusText" role="status" aria-live="polite">Loading...</div>

    <div id="scriptList" style="flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 4px;">
        <!-- Scripts will be loaded here by popup.js -->
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
